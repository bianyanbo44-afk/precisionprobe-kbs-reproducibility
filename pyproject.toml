[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precisionprobe"
version = "0.1.0"
description = "Cross-quantization behavioral disagreement for selective code generation"
requires-python = ">=3.11"
dependencies = [
  "evalplus==0.3.1",
  "huggingface-hub==1.27.0",
  "matplotlib==3.10.8",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "sympy==1.13.1",
]

[project.optional-dependencies]
dev = ["bibtexparser==1.4.4", "pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
